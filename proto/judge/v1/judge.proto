syntax = "proto3";

package zeorcode.judge.v1;

option go_package = "github.com/alonespig/zeorcode/proto/judge/v1;judgev1";

service JudgeNodeService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Judge(JudgeRequest) returns (stream JudgeEvent);
}

message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  string agent_version = 2;
  string go_judge_version = 3;
  int32 max_concurrency = 4;
  int32 running_tasks = 5;
  int64 cache_bytes = 6;
}

message ProblemArtifact {
  int64 problem_id = 1;
  string version = 2;
  string digest = 3;
}

message JudgeRequest {
  int64 submission_id = 1;
  int64 submission_version = 2;
  ProblemArtifact problem = 3;
  string language = 4;
  string source_code = 5;
  int64 time_limit_ms = 6;
  int64 memory_limit_mb = 7;
  int64 output_limit_bytes = 8;
}

enum JudgeEventType {
  JUDGE_EVENT_TYPE_UNSPECIFIED = 0;
  JUDGE_EVENT_TYPE_SYNCING = 1;
  JUDGE_EVENT_TYPE_COMPILING = 2;
  JUDGE_EVENT_TYPE_CASE_RESULT = 3;
  JUDGE_EVENT_TYPE_FINISHED = 4;
  JUDGE_EVENT_TYPE_FAILED = 5;
}

message CaseResult {
  int32 case_id = 1;
  int32 status = 2;
  int64 time_ns = 3;
  int64 memory_bytes = 4;
}

message FinalResult {
  int32 status = 1;
  string compile_output = 2;
  repeated CaseResult cases = 3;
}

message JudgeEvent {
  JudgeEventType type = 1;
  string message = 2;
  CaseResult case_result = 3;
  FinalResult final_result = 4;
}
